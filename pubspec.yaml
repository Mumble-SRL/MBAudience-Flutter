name: mbaudience
description: MBAudience is a plugin libary for MBurger, that lets you track user data and behavior inside your and to target messages only to specific users or groups of users.
version: 2.2.0
homepage: https://web.mburger.cloud/engagement-platform
repository: https://github.com/Mumble-SRL/MBAudience-Flutter

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  mburger: ^2.1.8
  package_info_plus: ^10.2.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5

# Standalone builds use the local modernized MBurger (device_info_plus ^13 →
# win32 ^6), which package_info_plus ^10 also requires. Ignored when consumed
# by a parent app that provides its own overrides.
dependency_overrides:
  mburger:
    path: ../MBurger-Dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mumble.mbaudience
        pluginClass: MbaudiencePlugin
      ios:
        pluginClass: MbaudiencePlugin
